# Builds Groovy Dolphin for Windows x64.
#
# Every successful build of port-to-latest replaces the "latest" release, so this
# link always has the newest zip (no GitHub sign-in needed):
# https://github.com/zander2k1/groovy-dolphin/releases/download/latest/groovy-dolphin-windows-x64.zip
# Each run also keeps the zip as an artifact on its Actions page for 30 days.

name: Windows build

on:
  push:
    branches: [port-to-latest]
  workflow_dispatch:

permissions:
  contents: write  # to update the "latest" release

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Current Dolphin requires Visual Studio 2026.
    runs-on: windows-2025-vs2026
    timeout-minutes: 240

    steps:
      - name: Check out code and bundled libraries
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch official Dolphin history (for NetPlay version matching)
        shell: pwsh
        run: |
          git remote add upstream https://github.com/dolphin-emu/dolphin.git
          git fetch --no-tags upstream master
          git fetch --no-tags upstream "refs/tags/2*:refs/tags/2*"

      - name: Configure
        shell: pwsh
        run: >
          cmake --preset visualstudio-release-x64
          -DENABLE_AUTOUPDATE=OFF
          -DENABLE_ANALYTICS=OFF
          -DENABLE_TESTS=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset visualstudio-build-release-x64 --target dolphin-emu -- /m /v:minimal 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface compiler/linker errors as annotations so they show up on the commit.
            Select-String -Path build.log -Pattern ': (fatal )?error [A-Z]+[0-9]+' |
              Select-Object -First 40 |
              ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit $code
          }

      - name: Package
        shell: pwsh
        run: |
          $bin = "build/release/x64/Binaries"
          # The build links Sys, COPYING, Licenses and qt.conf instead of copying them.
          # Replace the links with real copies so the zip is self-contained.
          $links = @{
            "Sys"      = "Data/Sys"
            "COPYING"  = "COPYING"
            "Licenses" = "LICENSES"
            "qt.conf"  = "Source/Core/DolphinQt/qt.conf.win"
          }
          foreach ($name in $links.Keys) {
            $path = Join-Path $bin $name
            if (Test-Path $path) {
              $item = Get-Item $path -Force
              if ($item.LinkType) { Remove-Item $path -Force -Recurse }
            }
            if (-not (Test-Path $path)) {
              Copy-Item $links[$name] $path -Recurse
            }
          }
          # Portable mode: settings and saves stay inside this folder, separate from
          # any regular Dolphin install on the same PC.
          New-Item -ItemType File -Path (Join-Path $bin "portable.txt") -Force | Out-Null
          $scmrev = Get-Content "build/release/x64/Source/Core/Common/scmrev.h" -Raw
          $np_desc = [regex]::Match($scmrev, 'SCM_UPSTREAM_DESC_STR "([^"]*)"').Groups[1].Value
          $np_rev = [regex]::Match($scmrev, 'SCM_UPSTREAM_REV_STR "([^"]*)"').Groups[1].Value
          if (-not $np_desc) { $np_desc = "unknown (official history was not found)" }
          "NETPLAY_DESC=$np_desc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @"
          Groovy Dolphin (port-to-latest)
          Commit: ${{ github.sha }}

          Dolphin with Groovy MiSTer output (video, audio, controller input).
          Original Groovy work by Sergi Clara (psakhis) and Martin Dahl (m-dahl).

          This folder is portable: settings and saves are stored in the "User" folder here.
          Groovy settings: Settings > Groovy MiSTer (and a Groovy MiSTer tab in each game's Properties).

          NetPlay: compatible with official Dolphin $np_desc (commit $np_rev).
          A friend on a regular PC needs that exact official development build from
          https://dolphin-emu.org/download/ (it is also shown in Help > About).
          "@ | Set-Content -Path (Join-Path $bin "README-GROOVY.txt")
          Get-ChildItem $bin | Format-Table Name, Length

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: groovy-dolphin-windows-x64
          path: build/release/x64/Binaries/
          if-no-files-found: error
          retention-days: 30

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/release/x64/Binaries/*" -DestinationPath groovy-dolphin-windows-x64.zip -Force
          Get-Item groovy-dolphin-windows-x64.zip | Format-Table Name, Length

      - name: Update the "latest" release
        if: github.ref == 'refs/heads/port-to-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest groovy-dolphin-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --latest \
            --notes "Newest Windows build of port-to-latest (commit ${GITHUB_SHA:0:10}). Unzip anywhere and run Dolphin.exe. NetPlay works with official Dolphin ${NETPLAY_DESC}."
