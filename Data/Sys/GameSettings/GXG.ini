# GXGE08 - MEGAMAN X COLLECTION
[Core]
# Values set here will override the main Dolphin settings.
[OnFrame]
[ActionReplay]
[Video_Settings]
SafeTextureCacheColorSamples = 0
[Video_Enhancements]
# Texture filtering causes lines with Mega Man X 3
ForceTextureFiltering = 0

[Graphics.Groovy]
# Groovy MiSTer: collection of 240p-era games. Output 240p on 15 kHz NTSC.
Prefer240p = True
